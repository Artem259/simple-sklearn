name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(main): release')
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group quality --group test

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-4|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --all-files

  build:
    name: Build Package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install dependencies
        run: uv sync --locked --only-group build

      - name: Verify sdist contents
        run: uv run --no-sync check-sdist --inject-junk

      - name: Build sdist and wheel
        run: uv build --clear

      - name: Verify wheel contents
        run: uv run --no-sync check-wheel-contents dist/*.whl

      - name: Validate metadata with Twine
        run: uv run --no-sync twine check --strict dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/
          retention-days: 7

  tests:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: dist/

      - name: Install built wheel and test dependencies
        shell: bash
        run: |
          uv sync --locked --no-default-groups --group test --no-install-project
          WHEEL=(dist/*.whl)
          uv pip install --no-deps "${WHEEL[0]}"

      - name: Run tests with Pytest
        shell: bash
        run: |
          uv run --no-sync pytest \
            --cov=simple_sklearn \
            --cov-branch \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && !env.ACT }}
        uses: codecov/codecov-action@v5
        with:
          report_type: coverage
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && !env.ACT }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: ./junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  tests-passed:
    name: All Tests Passed
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "All matrix tests passed successfully."

  docs-build:
    name: Build Documentation
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Configure GitHub Pages
        if: ${{ !env.ACT }}
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group docs

      - name: Build MkDocs
        run: uv run --no-sync mkdocs build --strict
        env:
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload docs HTML artifact
        if: |
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: site/
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
          retention-days: 7

  testpypi-publish:
    name: Publish to TestPyPI
    needs: tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/simple-sklearn

    permissions:
      id-token: write

    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: dist/

      - name: Publish package distributions to TestPyPI
        if: ${{ !env.ACT }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi-publish:
    name: Publish to PyPI
    needs: tests
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/simple-sklearn

    permissions:
      id-token: write

    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: dist/

      - name: Publish package distributions to PyPI
        if: ${{ !env.ACT }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0

  docs-publish:
    name: Publish to GitHub Pages
    needs: [ docs-build, pypi-publish ]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v4
