repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [ --unsafe ]
      - id: check-toml
      - id: check-added-large-files
        exclude: ^uv\.lock$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        types: [markdown]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [ --strict ]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args:
          - --extra-keys
          - "metadata.language_info.version metadata.kernelspec"

  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock (check)
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff
        name: ruff (lint)
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

      - id: mypy
        name: mypy (base)
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: nbqa-mypy
        name: mypy (notebooks)
        entry: uv run --no-sync nbqa mypy docs/notebooks/ --cache-dir=.mypy_cache_notebooks --allow-redefinition
        language: system
        types_or: [python, jupyter]
        files: ^docs/notebooks/
        pass_filenames: false
